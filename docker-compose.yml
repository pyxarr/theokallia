services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: theokallia-api
    restart: always
    ports:
      - "3333:3333"
    env_file:
      - .env.docker
    volumes:
      - ./.env.docker:/app/apps/api/.env

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: theokallia-web
    restart: always
    depends_on:
      - api
    ports:
      - "3000:3000"
    env_file:
      - .env.docker
